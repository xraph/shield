name: Release

on:
  push:
    tags:
      - "v*"
      - "integrations/nexusguard/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0, or integrations/nexusguard/v1.0.0 for the nexusguard module)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set release tag
        id: set-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            echo "Creating tag $TAG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # A tag under integrations/nexusguard/ releases that module; any
          # other tag releases shield itself.
          case "$TAG" in
            integrations/nexusguard/*)
              echo "module=github.com/xraph/shield/integrations/nexusguard" >> "$GITHUB_OUTPUT"
              echo "version=${TAG#integrations/nexusguard/}" >> "$GITHUB_OUTPUT"
              echo "match=integrations/nexusguard/v*" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "module=github.com/xraph/shield" >> "$GITHUB_OUTPUT"
              echo "version=$TAG" >> "$GITHUB_OUTPUT"
              echo "match=v*" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify build
        run: |
          go mod download
          go build ./...
          go test -race -count=1 ./...

      # The released module must build on its own, against the shield and
      # nexus versions its go.mod pins, so no workspace here.
      - name: Verify nexusguard module
        if: startsWith(steps.set-tag.outputs.tag, 'integrations/nexusguard/')
        working-directory: integrations/nexusguard
        env:
          GOWORK: "off"
        run: |
          go mod download
          go build ./...
          go vet ./...
          go test -race -count=1 ./...

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match '${{ steps.set-tag.outputs.match }}' HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.set-tag.outputs.tag }}
          body: |
            ## Changes

            ${{ steps.notes.outputs.notes }}

            ---

            ### Installation

            ```bash
            go get ${{ steps.set-tag.outputs.module }}@${{ steps.set-tag.outputs.version }}
            ```
          generate_release_notes: true
